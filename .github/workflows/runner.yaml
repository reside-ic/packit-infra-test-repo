on:
  push:

jobs:
  test:
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: https://mrc-ide.r-universe.dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: cli, httr2
          dependencies: NA
      - name: Execute tasks
        shell: bash
        run: Rscript --verbose 'run.R'
